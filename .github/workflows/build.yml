name: Evolution System v7.7.7 Absoluta - Platform builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows ${{ matrix.architecture }} desktop executable
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.architecture }}

      - name: Install build dependency
        run: python -m pip install --upgrade pyinstaller

      - name: Compile Windows application
        run: >-
          python -m PyInstaller --clean --onefile --windowed
          --name Evolution_System_v7.7.7_absoluta
          Evolution_System_v7.7.7_absoluta.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evolution_System_v7.7.7_Windows_${{ matrix.architecture }}
          path: dist/Evolution_System_v7.7.7_absoluta.exe
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Linux ${{ matrix.architecture }} desktop executable
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Tk and Python build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk python3-venv

      - name: Create build environment
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip pyinstaller

      - name: Verify Tkinter availability
        run: .venv/bin/python -c "import tkinter"

      - name: Compile Linux application
        run: >-
          .venv/bin/python -m PyInstaller --clean --onefile --windowed
          --name Evolution_System_v7.7.7_absoluta
          Evolution_System_v7.7.7_absoluta.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evolution_System_v7.7.7_Linux_${{ matrix.architecture }}
          path: dist/Evolution_System_v7.7.7_absoluta
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Android APK for ARM and x86 devices
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf \
            build-essential \
            cmake \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-setuptools \
            python3-venv \
            unzip \
            zip \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python3 -m venv .buildozer-venv
          .buildozer-venv/bin/python -m pip install --upgrade pip
          .buildozer-venv/bin/python -m pip install buildozer cython==0.29.36

      - name: Build Android APK
        working-directory: android
        run: ../.buildozer-venv/bin/buildozer android debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Evolution_System_v7.7.7_Android_APK
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 30
